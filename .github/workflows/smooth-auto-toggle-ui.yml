name: Smooth auto-update toggle UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smooth-auto-toggle-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch toggle UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('temmemo/bcp_enhancements.js')
          text = path.read_text(encoding='utf-8')
          old_css = "      .bcpEnhanceAuto input:disabled + .bcpEnhanceTrack {\n        opacity: .55;\n        cursor: wait;\n      }"
          new_css = "      .bcpEnhanceAuto input:disabled + .bcpEnhanceTrack {\n        opacity: 1;\n        cursor: default;\n      }"
          if old_css not in text:
              raise SystemExit('temmemo disabled style marker not found')
          text = text.replace(old_css, new_css, 1)

          old_save = "    const toggle = $(\"bcpAutoUpdateToggle\");\n    if (toggle) toggle.disabled = true;\n    renderAutoState(enabled, \"保存中\");"
          new_save = "    const toggle = $(\"bcpAutoUpdateToggle\");\n    // 見た目は即座に確定させ、保存処理だけ裏で行う。\n    renderAutoState(enabled);\n    if (toggle) toggle.disabled = true;"
          if old_save not in text:
              raise SystemExit('temmemo save marker not found')
          text = text.replace(old_save, new_save, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('standalone-bcp/panel.js')
          text = path.read_text(encoding='utf-8')
          old = "  toggle.disabled = true;\n  if (state) state.textContent = \"保存中\";"
          new = "  // 見た目は即座に確定させ、保存処理だけ裏で行う。\n  if (state) state.textContent = toggle.checked ? \"ON\" : \"OFF\";\n  toggle.disabled = true;"
          if old not in text:
              raise SystemExit('standalone toggle marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          manifest_path = Path('temmemo/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.3.137'
          manifest['description'] = '自動更新ON/OFF切替時の「保存中」表示と一時的な薄暗化を廃止し、スイッチが即座に自然に切り替わるよう改善。 / ' + manifest.get('description', '')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('standalone-bcp/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.0.8'
          manifest['description'] = 'BCP分離版。v1.0.8で自動更新ON/OFF切替時の「保存中」表示を廃止し、スイッチが即座に自然に切り替わるよう改善。'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --check temmemo/bcp_enhancements.js
          node --check standalone-bcp/panel.js
          python -m json.tool temmemo/manifest.json >/dev/null
          python -m json.tool standalone-bcp/manifest.json >/dev/null

      - name: Build ZIPs
        shell: bash
        run: |
          set -euo pipefail
          (cd temmemo && zip -qr ../temmemo_v1.3.137.zip .)
          (cd standalone-bcp && zip -qr ../temmemo_bcp_standalone_v1.0.8.zip .)

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: smooth-toggle-download-zips
          path: |
            temmemo_v1.3.137.zip
            temmemo_bcp_standalone_v1.0.8.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/smooth-auto-toggle-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Smooth auto-update toggle UI"
          git push
