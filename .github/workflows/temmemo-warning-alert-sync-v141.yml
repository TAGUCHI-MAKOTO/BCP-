name: Temmemo warning alert sync v1.3.141

on:
  push:
    paths:
      - '.github/workflows/temmemo-warning-alert-sync-v141.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch temmemo warning alert behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          sw = Path('temmemo/service_worker_entry.js')
          text = sw.read_text(encoding='utf-8')

          old = 'const BCP_STARTUP_ATTENTION_KEY = "bcp_startup_attention_v1";'
          new = old + '\nconst BCP_TAB_ALERT_ATTENTION_KEY = "bcp_tab_alert_attention_v1";'
          assert old in text and 'BCP_TAB_ALERT_ATTENTION_KEY' not in text
          text = text.replace(old, new, 1)

          text = text.replace('// ---- BCPサブタブ別の未読重要度判定 v1.3.138 ----', '// ---- BCPサブタブ別の未読重要度判定 v1.3.141 ----', 1)

          old = '''function bcpTabWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpTabWarningMap(oldData), newMap=bcpTabWarningMap(newData);
            let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous) return 2;
              if (current.level > previous.level) return 2;
              if (current.level!==previous.level || current.code!==previous.code || current.name!==previous.name || current.status!==previous.status || current.reportDatetime!==previous.reportDatetime){
                severity=Math.max(severity,1);
              }
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }'''
          new = '''function bcpTabWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpTabWarningMap(oldData), newMap=bcpTabWarningMap(newData);
            let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous){
                if (Number(current.level||0) >= 3) return 2;
                severity=Math.max(severity,1);
                continue;
              }
              if (current.level > previous.level) return 2;
              if (current.level!==previous.level || current.code!==previous.code || current.name!==previous.name || current.status!==previous.status || current.reportDatetime!==previous.reportDatetime){
                severity=Math.max(severity,1);
              }
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async function bcpMarkTabUnread(kind,severity){
            if (!["quake","warning","cyclone"].includes(kind)) return;
            const incoming=bcpTabSeverityLevel(severity);
            if (!incoming) return;
            const data=await chrome.storage.local.get([BCP_TAB_UNREAD_KEY]);
            const raw=data[BCP_TAB_UNREAD_KEY]||{};
            const merged=Math.max(bcpTabSeverityLevel(raw[kind]),incoming);
            await chrome.storage.local.set({
              [BCP_TAB_UNREAD_KEY]:{
                quake:bcpTabSeverityValue(kind==="quake"?merged:bcpTabSeverityLevel(raw.quake)),
                warning:bcpTabSeverityValue(kind==="warning"?merged:bcpTabSeverityLevel(raw.warning)),
                cyclone:bcpTabSeverityValue(kind==="cyclone"?merged:bcpTabSeverityLevel(raw.cyclone)),
                lastAt:Date.now()
              }
            });
          }'''
          new = '''async function bcpMarkTabUnread(kind,severity){
            if (!["quake","warning","cyclone"].includes(kind)) return;
            const incoming=bcpTabSeverityLevel(severity);
            if (!incoming) return;
            const data=await chrome.storage.local.get([BCP_TAB_UNREAD_KEY, BCP_TAB_ALERT_ATTENTION_KEY]);
            const raw=data[BCP_TAB_UNREAD_KEY]||{};
            const merged=Math.max(bcpTabSeverityLevel(raw[kind]),incoming);
            const updates={
              [BCP_TAB_UNREAD_KEY]:{
                quake:bcpTabSeverityValue(kind==="quake"?merged:bcpTabSeverityLevel(raw.quake)),
                warning:bcpTabSeverityValue(kind==="warning"?merged:bcpTabSeverityLevel(raw.warning)),
                cyclone:bcpTabSeverityValue(kind==="cyclone"?merged:bcpTabSeverityLevel(raw.cyclone)),
                lastAt:Date.now()
              }
            };
            if (kind==="warning" && incoming>=2){
              const alertRaw=data[BCP_TAB_ALERT_ATTENTION_KEY]||{};
              const nextAlert={
                quake:alertRaw.quake===true,
                warning:true,
                cyclone:alertRaw.cyclone===true,
                active:true,
                lastAt:Date.now()
              };
              nextAlert.active=nextAlert.quake||nextAlert.warning||nextAlert.cyclone;
              updates[BCP_TAB_ALERT_ATTENTION_KEY]=nextAlert;
            }
            await chrome.storage.local.set(updates);
          }'''
          assert old in text
          text = text.replace(old, new, 1)
          sw.write_text(text, encoding='utf-8')

          glow = Path('temmemo/bcp_tab_glow.js')
          text = glow.read_text(encoding='utf-8')
          text = text.replace('/* BCP category unread glow v1.3.140', '/* BCP category unread glow v1.3.141', 1)
          text = text.replace(' * Startup-important patrol lamp stays active until the matching category tab is acknowledged.', ' * Startup-important alerts and red weather-tab alerts keep the patrol lamp active until the matching category tab is acknowledged.', 1)

          old = '  const STARTUP_ATTENTION_KEY = "bcp_startup_attention_v1";'
          new = old + '\n  const TAB_ALERT_ATTENTION_KEY = "bcp_tab_alert_attention_v1";'
          assert old in text and 'TAB_ALERT_ATTENTION_KEY' not in text
          text = text.replace(old, new, 1)

          old = '''  function renderStartupAttention(value){
            const startup = normalizeStartup(value);
            const button = document.getElementById("btnBcp");
            if (!button) return;
            button.classList.toggle("bcpStartupAttention", startup.active);
          }

          async function load(){
            const data = await chrome.storage.local.get([STORE_KEY, STARTUP_ATTENTION_KEY]);
            render(data[STORE_KEY]);
            renderStartupAttention(data[STARTUP_ATTENTION_KEY]);
          }'''
          new = '''  async function renderPatrolAttention(){
            try{
              const data = await chrome.storage.local.get([STARTUP_ATTENTION_KEY, TAB_ALERT_ATTENTION_KEY]);
              const startup = normalizeStartup(data[STARTUP_ATTENTION_KEY]);
              const tabAlert = normalizeStartup(data[TAB_ALERT_ATTENTION_KEY]);
              const button = document.getElementById("btnBcp");
              if (!button) return;
              button.classList.toggle("bcpStartupAttention", startup.active || tabAlert.active);
            }catch(_){ }
          }

          async function load(){
            const data = await chrome.storage.local.get([STORE_KEY]);
            render(data[STORE_KEY]);
            await renderPatrolAttention();
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    const data = await chrome.storage.local.get([STORE_KEY, STARTUP_ATTENTION_KEY]);
            const current = normalize(data[STORE_KEY]);
            const startup = normalizeStartup(data[STARTUP_ATTENTION_KEY]);
            const changes = {};'''
          new = '''    const data = await chrome.storage.local.get([STORE_KEY, STARTUP_ATTENTION_KEY, TAB_ALERT_ATTENTION_KEY]);
            const current = normalize(data[STORE_KEY]);
            const startup = normalizeStartup(data[STARTUP_ATTENTION_KEY]);
            const tabAlert = normalizeStartup(data[TAB_ALERT_ATTENTION_KEY]);
            const changes = {};'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''    if (startup[kind]){
              startup[kind] = false;
              startup.active = startup.quake || startup.warning || startup.cyclone;
              changes[STARTUP_ATTENTION_KEY] = {
                quake: startup.quake,
                warning: startup.warning,
                cyclone: startup.cyclone,
                active: startup.active,
                lastAt: startup.active ? startup.lastAt : 0,
              };
            }

            if (Object.keys(changes).length) await chrome.storage.local.set(changes);'''
          replacement = '''    if (startup[kind]){
              startup[kind] = false;
              startup.active = startup.quake || startup.warning || startup.cyclone;
              changes[STARTUP_ATTENTION_KEY] = {
                quake: startup.quake,
                warning: startup.warning,
                cyclone: startup.cyclone,
                active: startup.active,
                lastAt: startup.active ? startup.lastAt : 0,
              };
            }

            if (tabAlert[kind]){
              tabAlert[kind] = false;
              tabAlert.active = tabAlert.quake || tabAlert.warning || tabAlert.cyclone;
              changes[TAB_ALERT_ATTENTION_KEY] = {
                quake: tabAlert.quake,
                warning: tabAlert.warning,
                cyclone: tabAlert.cyclone,
                active: tabAlert.active,
                lastAt: tabAlert.active ? tabAlert.lastAt : 0,
              };
            }

            if (Object.keys(changes).length) await chrome.storage.local.set(changes);'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = '''      if (changes[STORE_KEY]) render(changes[STORE_KEY].newValue);
              if (changes[STARTUP_ATTENTION_KEY]) renderStartupAttention(changes[STARTUP_ATTENTION_KEY].newValue);'''
          new = '''      if (changes[STORE_KEY]) render(changes[STORE_KEY].newValue);
              if (changes[STARTUP_ATTENTION_KEY] || changes[TAB_ALERT_ATTENTION_KEY]) renderPatrolAttention().catch(() => {});'''
          assert old in text
          text = text.replace(old, new, 1)
          glow.write_text(text, encoding='utf-8')

          manifest = Path('temmemo/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('version') == '1.3.140'
          data['version'] = '1.3.141'
          prefix = '気象Tabの未読判定を整理し、新規の警報以上・レベル上昇は赤、新規注意報・同レベル更新・解除/低下は黄色に統一。気象Tabが赤の間は🚨も点滅を維持し、BCP画面を開くだけでは消えず、気象Tab確認時に両方解除。 / '
          data['description'] = prefix + data.get('description','')
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check temmemo/service_worker_entry.js
          node --check temmemo/bcp_tab_glow.js
          python -m json.tool temmemo/manifest.json >/dev/null
          grep -q '"version": "1.3.141"' temmemo/manifest.json
          grep -q 'if (Number(current.level||0) >= 3) return 2;' temmemo/service_worker_entry.js
          grep -q 'TAB_ALERT_ATTENTION_KEY' temmemo/bcp_tab_glow.js

      - name: Build ZIP
        shell: bash
        run: zip -qr temmemo_v1.3.141.zip temmemo

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: temmemo-v1.3.141
          path: temmemo_v1.3.141.zip

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f temmemo_v1.3.141.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temmemo-warning-alert-sync-v141.yml
          git add temmemo/service_worker_entry.js temmemo/bcp_tab_glow.js temmemo/manifest.json
          git commit -m "Sync weather tab red alerts with patrol lamp"
          git push
