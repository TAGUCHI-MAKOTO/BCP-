name: Fix temmemo startup patrol attention

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temmemo-startup-attention-v140.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup patrol state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          entry = Path("temmemo/service_worker_entry.js")
          text = entry.read_text(encoding="utf-8")

          marker = 'const BCP_TAB_UNREAD_KEY = "bcp_tab_unread_v1";\n'
          if 'BCP_STARTUP_ATTENTION_KEY' not in text:
              if marker not in text:
                  raise SystemExit("const marker not found")
              text = text.replace(marker, marker + 'const BCP_STARTUP_ATTENTION_KEY = "bcp_startup_attention_v1";\n', 1)

          start = text.find('async function bcpStartupAttentionOnly(){')
          end = text.find('\nconst bcpNotifyOriginal = bcpNotify;', start)
          if start < 0 or end < 0:
              raise SystemExit("startup attention function marker not found")
          replacement = """async function bcpStartupAttentionOnly(kind){
            try{
              const attentionKey = \"bcp_attention_v1\";
              const data = await chrome.storage.local.get([attentionKey, BCP_STARTUP_ATTENTION_KEY]);
              const attention = data[attentionKey] || { count: 0, lastAt: 0 };
              const current = data[BCP_STARTUP_ATTENTION_KEY] || {};
              const nextStartup = {
                quake: current.quake === true,
                warning: current.warning === true,
                cyclone: current.cyclone === true,
                active: false,
                lastAt: Date.now(),
              };
              if ([\"quake\", \"warning\", \"cyclone\"].includes(kind)) nextStartup[kind] = true;
              nextStartup.active = nextStartup.quake || nextStartup.warning || nextStartup.cyclone;
              await chrome.storage.local.set({
                [attentionKey]: {
                  count: Math.max(1, (Number(attention.count) || 0) + 1),
                  lastAt: Date.now(),
                },
                [BCP_STARTUP_ATTENTION_KEY]: nextStartup,
              });
            }catch(_){ }
          }
          """
          text = text[:start] + replacement + text[end:]

          if 'await bcpStartupAttentionOnly();' not in text:
              raise SystemExit("startup attention call marker not found")
          text = text.replace('await bcpStartupAttentionOnly();', 'await bcpStartupAttentionOnly(startupKind);', 1)

          old_arm = """function bcpArmStartupNotificationSuppression(){
            bcpStartupPending = new Set(BCP_STARTUP_REFRESH_NAMES);
          }"""
          new_arm = """function bcpArmStartupNotificationSuppression(){
            bcpStartupPending = new Set(BCP_STARTUP_REFRESH_NAMES);
            chrome.storage.local.set({
              [BCP_STARTUP_ATTENTION_KEY]: {
                quake: false,
                warning: false,
                cyclone: false,
                active: false,
                lastAt: 0,
              },
            }).catch(() => {});
          }"""
          if old_arm not in text:
              raise SystemExit("startup arm marker not found")
          text = text.replace(old_arm, new_arm, 1)
          entry.write_text(text, encoding="utf-8")

          manifest_path = Path("temmemo/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "1.3.140"
          prefix = "起動時の新規重要事象による🚨をカテゴリ別の専用未確認状態として保持し、BCP画面へ入っただけでは消えず、該当の地震・気象警報・台風Tabを確認すると解除。起動時OS通知抑止は維持。 / "
          if not manifest.get("description", "").startswith(prefix):
              manifest["description"] = prefix + manifest.get("description", "")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          node --check temmemo/service_worker_entry.js
          node --check temmemo/bcp_tab_glow.js
          python -m json.tool temmemo/manifest.json >/dev/null
          grep -q 'bcp_startup_attention_v1' temmemo/service_worker_entry.js
          grep -q 'bcpStartupAttention' temmemo/bcp_tab_glow.js
          grep -q '"version": "1.3.140"' temmemo/manifest.json

      - name: Build ZIP
        shell: bash
        run: |
          cd temmemo
          zip -qr ../temmemo_v1.3.140.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: temmemo-v1.3.140
          path: temmemo_v1.3.140.zip
          retention-days: 90

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temmemo-startup-attention-v140.yml
          git add temmemo/service_worker_entry.js temmemo/bcp_tab_glow.js temmemo/manifest.json .github/workflows/temmemo-startup-attention-v140.yml
          git commit -m "Keep startup patrol alert until category acknowledgement"
          git push origin main
