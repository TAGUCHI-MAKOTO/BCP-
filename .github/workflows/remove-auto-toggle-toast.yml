name: Remove auto-update toggle toast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-auto-toggle-toast.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove success toast from both extensions
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/showToast(enabled ? "BCP自動更新：ON" : "BCP自動更新：OFF");/d' temmemo/bcp_enhancements.js
          sed -i '/toast(toggle.checked ? "BCP自動更新：ON" : "BCP自動更新：OFF");/d' standalone-bcp/panel.js

          python -c 'import json; from pathlib import Path; p=Path("temmemo/manifest.json"); d=json.loads(p.read_text(encoding="utf-8")); d["version"]="1.3.136"; d["description"]="自動更新ON/OFF切替時の成功メッセージ表示を廃止。 / "+d["description"]; p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")'
          python -c 'import json; from pathlib import Path; p=Path("standalone-bcp/manifest.json"); d=json.loads(p.read_text(encoding="utf-8")); d["version"]="1.0.7"; d["description"]="テン・メモからBCP機能のみを分離した単独版。v1.0.7で自動更新ON/OFF切替時の成功メッセージ表示を廃止。"; p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")'

          node --check temmemo/bcp_enhancements.js
          node --check standalone-bcp/panel.js
          python -m json.tool temmemo/manifest.json >/dev/null
          python -m json.tool standalone-bcp/manifest.json >/dev/null

          if grep -q 'BCP自動更新：ON' temmemo/bcp_enhancements.js; then exit 1; fi
          if grep -q 'BCP自動更新：ON' standalone-bcp/panel.js; then exit 1; fi

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-auto-toggle-toast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove auto-update toggle success toast"
          git push
