name: Standalone v1.0.10 panel unread fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standalone-v110-panel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove startup global acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          panel = Path("standalone-bcp/panel.js")
          text = panel.read_text(encoding="utf-8")
          old = '''document.addEventListener("DOMContentLoaded", async () => {
            wire();
            await loadAndRender({ hydrate: true });
            await send("ackAttention");
            $("bcpAttention").hidden = true;
          });'''
          new = '''document.addEventListener("DOMContentLoaded", async () => {
            wire();
            await loadAndRender({ hydrate: true });
            // v1.0.10: 起動時に全カテゴリを一括既読にしない。
            // 未読は各Tabを実際に確認した時だけカテゴリ単位で解除する。
            if ($("bcpAttention")) $("bcpAttention").hidden = true;
          });'''
          if old not in text:
              raise SystemExit("DOMContentLoaded ackAttention marker not found")
          panel.write_text(text.replace(old, new, 1), encoding="utf-8")

          manifest_path = Path("standalone-bcp/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          prefix = "画面起動時の一括既読処理も廃止し、未読は該当Tabを確認した時だけカテゴリ単位で解除。 / "
          if not manifest.get("description", "").startswith(prefix):
              manifest["description"] = prefix + manifest.get("description", "")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          node --check standalone-bcp/background.js
          node --check standalone-bcp/panel.js
          python -m json.tool standalone-bcp/manifest.json >/dev/null
          grep -q '起動時に全カテゴリを一括既読にしない' standalone-bcp/panel.js
          if grep -A5 'DOMContentLoaded", async' standalone-bcp/panel.js | grep -q 'send("ackAttention")'; then
            echo "startup global ack still present" >&2
            exit 1
          fi
          grep -q '"version": "1.0.10"' standalone-bcp/manifest.json

      - name: Build ZIP
        shell: bash
        run: |
          cd standalone-bcp
          zip -qr ../temmemo_bcp_standalone_v1.0.10.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: temmemo-bcp-standalone-v1.0.10-final
          path: temmemo_bcp_standalone_v1.0.10.zip
          retention-days: 90

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/standalone-v110-panel-fix.yml
          git add standalone-bcp/panel.js standalone-bcp/manifest.json .github/workflows/standalone-v110-panel-fix.yml
          git commit -m "Preserve standalone startup tab unread until viewed"
          git push origin main
