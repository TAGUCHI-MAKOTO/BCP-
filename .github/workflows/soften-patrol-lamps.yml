name: Soften patrol lamps

on:
  push:
    paths:
      - '.github/workflows/soften-patrol-lamps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, base64
          tem_b64=''
          stand_b64=''
          p=Path('temmemo/panel.css'); s=p.read_text(encoding='utf-8'); assert 'bcpPatrolLampSoftV142' not in s; p.write_text(s+base64.b64decode(tem_b64).decode(),encoding='utf-8')
          p=Path('standalone-bcp/panel.css'); s=p.read_text(encoding='utf-8'); assert 'oshirasePatrolSoftV1014' not in s; p.write_text(s+base64.b64decode(stand_b64).decode(),encoding='utf-8')
          p=Path('temmemo/manifest.json'); m=json.loads(p.read_text(encoding='utf-8')); assert m['version']=='1.3.141'; m['version']='1.3.142'; m['description']='🚨の点滅を約1.35秒周期の柔らかい明滅へ変更。判定・解除ルールは従来どおり。 / '+m.get('description',''); p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('standalone-bcp/manifest.json'); m=json.loads(p.read_text(encoding='utf-8')); assert m['version']=='1.0.13'; m['version']='1.0.14'; m['description']='🚨の点滅を約1.35秒周期の柔らかい明滅へ変更。判定・解除ルールは従来どおり。 / '+m.get('description',''); p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m json.tool temmemo/manifest.json >/dev/null
          python -m json.tool standalone-bcp/manifest.json >/dev/null
          grep -q '"version": "1.3.142"' temmemo/manifest.json
          grep -q '"version": "1.0.14"' standalone-bcp/manifest.json
          grep -q bcpPatrolLampSoftV142 temmemo/panel.css
          grep -q oshirasePatrolSoftV1014 standalone-bcp/panel.css

      - name: Build ZIPs
        run: |
          zip -qr temmemo_v1.3.142.zip temmemo
          zip -qr keihou-oshirasekun_v1.0.14.zip standalone-bcp
          unzip -t temmemo_v1.3.142.zip >/dev/null
          unzip -t keihou-oshirasekun_v1.0.14.zip >/dev/null

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: soft-patrol-lamp-zips
          path: |
            temmemo_v1.3.142.zip
            keihou-oshirasekun_v1.0.14.zip

      - name: Commit
        run: |
          rm -f temmemo_v1.3.142.zip keihou-oshirasekun_v1.0.14.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/soften-patrol-lamps.yml
          git add temmemo/panel.css temmemo/manifest.json standalone-bcp/panel.css standalone-bcp/manifest.json
          git commit -m "Soften patrol lamp blinking"
          git push
