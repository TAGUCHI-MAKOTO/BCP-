name: Standalone startup tab unread v1.0.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standalone-startup-tabs-v110.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch standalone startup tab unread
        shell: bash
        run: |
          set -euo pipefail
          cat >> standalone-bcp/background.js <<'EOF'

          /* ===== v1.0.10: 起動時のTab未読を通常時と同じ赤/黄ルールで確実に反映 =====
           * startupRefresh前後の保存データを明示比較し、
           * 新規・強化 = alert(赤) / 同レベル更新 = update(黄) をカテゴリ別に保持する。
           * OS通知の起動時抑止は既存startupRefresh側のまま維持する。
           */
          const bcpStandaloneStartupRefreshV110Original = startupRefresh;
          startupRefresh = async function(...args){
            let before = {};
            try{
              before = await chrome.storage.local.get([STORE.quakes, STORE.warnings, STORE.cyclones]);
            }catch(_){ }

            const result = await bcpStandaloneStartupRefreshV110Original.apply(this, args);

            try{
              const after = await chrome.storage.local.get([STORE.quakes, STORE.warnings, STORE.cyclones]);
              const detected = [
                ["quake", bcpStandaloneQuakeSeverity(before[STORE.quakes], after[STORE.quakes])],
                ["warning", bcpStandaloneWarningSeverity(before[STORE.warnings], after[STORE.warnings])],
                ["cyclone", bcpStandaloneCycloneSeverity(before[STORE.cyclones], after[STORE.cyclones])],
              ];
              for (const [kind, severity] of detected){
                if (severity) await addAttention(kind, severity);
              }
            }catch(_){ }

            return result;
          };
          EOF

          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("standalone-bcp/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "1.0.10"
          data["description"] = (
              "BCP分離版。v1.0.10で起動時の初回巡回も前回データとの差分を明示比較し、"
              "新規事象・警戒レベル/勢力上昇は赤、同レベル更新は黄色でTab未読表示へ確実に反映。"
              "起動時のOS通知抑止は維持。 / " + data.get("description", "")
          )
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          node --check standalone-bcp/background.js
          node --check standalone-bcp/panel.js
          python -m json.tool standalone-bcp/manifest.json >/dev/null
          grep -q 'bcpStandaloneStartupRefreshV110Original' standalone-bcp/background.js
          grep -q '"version": "1.0.10"' standalone-bcp/manifest.json

      - name: Build ZIP
        shell: bash
        run: |
          cd standalone-bcp
          zip -qr ../temmemo_bcp_standalone_v1.0.10.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: temmemo-bcp-standalone-v1.0.10
          path: temmemo_bcp_standalone_v1.0.10.zip
          retention-days: 90

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/standalone-startup-tabs-v110.yml
          git add standalone-bcp/background.js standalone-bcp/manifest.json .github/workflows/standalone-startup-tabs-v110.yml
          git commit -m "Keep standalone startup tab unread state"
          git push origin main
