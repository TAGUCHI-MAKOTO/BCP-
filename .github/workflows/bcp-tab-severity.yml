name: Color-code BCP tab unread severity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bcp-tab-severity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch tab severity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_tail(path, marker, replacement):
              text = path.read_text(encoding="utf-8")
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f"marker not found in {path}: {marker}")
              path.write_text(text[:pos] + replacement, encoding="utf-8")

          def replace_between(path, start, end, replacement):
              text = path.read_text(encoding="utf-8")
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"start marker not found in {path}: {start}")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"end marker not found in {path}: {end}")
              path.write_text(text[:i] + replacement + text[j:], encoding="utf-8")

          # -------------------------
          # テンメモ: 表示側（黄/赤）
          # -------------------------
          Path("temmemo/bcp_tab_glow.js").write_text(r'''"use strict";

          /* BCP category unread glow v1.3.138
           * update = yellow / alert = red / alert wins until viewed.
           */
          (() => {
            const STORE_KEY = "bcp_tab_unread_v1";
            const TAB_IDS = {
              quake: "bcpSubJma",
              warning: "bcpSubWarning",
              cyclone: "bcpSubCyclone",
            };

            function levelOf(value){
              if (value === true) return 2;
              if (value === "alert" || value === "red" || Number(value) >= 2) return 2;
              if (value === "update" || value === "yellow" || Number(value) === 1) return 1;
              return 0;
            }

            function valueOf(level){
              return Number(level) >= 2 ? "alert" : Number(level) === 1 ? "update" : false;
            }

            function normalize(value){
              const raw = value && typeof value === "object" ? value : {};
              return {
                quake: levelOf(raw.quake),
                warning: levelOf(raw.warning),
                cyclone: levelOf(raw.cyclone),
                lastAt: Number(raw.lastAt || 0),
              };
            }

            function injectStyles(){
              if (document.getElementById("bcpTabGlowStyles")) return;
              const style = document.createElement("style");
              style.id = "bcpTabGlowStyles";
              style.textContent = `
                .bcpSubTab.bcpHasUpdate {
                  border-color:#facc15 !important;
                  box-shadow:0 0 0 1px rgba(250,204,21,.75) inset,0 0 8px rgba(250,204,21,.75),0 0 16px rgba(245,158,11,.38);
                  animation:bcpMainTabGlowYellow 1.35s ease-in-out infinite;
                }
                .bcpSubTab.bcpHasAlert {
                  border-color:#ef4444 !important;
                  box-shadow:0 0 0 1px rgba(239,68,68,.82) inset,0 0 9px rgba(239,68,68,.82),0 0 19px rgba(220,38,38,.48);
                  animation:bcpMainTabGlowRed 1.05s ease-in-out infinite;
                }
                .bcpSubTab.on.bcpHasUpdate{border-color:#facc15 !important}
                .bcpSubTab.on.bcpHasAlert{border-color:#ef4444 !important}
                @keyframes bcpMainTabGlowYellow{
                  0%,100%{box-shadow:0 0 0 1px rgba(250,204,21,.55) inset,0 0 5px rgba(250,204,21,.45),0 0 10px rgba(245,158,11,.20)}
                  50%{box-shadow:0 0 0 1px rgba(253,224,71,.95) inset,0 0 11px rgba(253,224,71,.95),0 0 22px rgba(245,158,11,.58)}
                }
                @keyframes bcpMainTabGlowRed{
                  0%,100%{box-shadow:0 0 0 1px rgba(239,68,68,.62) inset,0 0 6px rgba(239,68,68,.52),0 0 12px rgba(220,38,38,.24)}
                  50%{box-shadow:0 0 0 1px rgba(248,113,113,.98) inset,0 0 13px rgba(248,113,113,.98),0 0 25px rgba(220,38,38,.66)}
                }
                @media (prefers-reduced-motion:reduce){
                  .bcpSubTab.bcpHasUpdate{animation:none;box-shadow:0 0 0 1px rgba(250,204,21,.85) inset,0 0 10px rgba(250,204,21,.8)}
                  .bcpSubTab.bcpHasAlert{animation:none;box-shadow:0 0 0 1px rgba(239,68,68,.9) inset,0 0 11px rgba(239,68,68,.9)}
                }
              `;
              document.head.appendChild(style);
            }

            function render(value){
              const unread = normalize(value);
              for (const [kind, tabId] of Object.entries(TAB_IDS)){
                const tab = document.getElementById(tabId);
                if (!tab) continue;
                tab.classList.toggle("bcpHasUpdate", unread[kind] === 1);
                tab.classList.toggle("bcpHasAlert", unread[kind] >= 2);
                tab.classList.remove("bcpHasNew");
              }
            }

            async function load(){
              const data = await chrome.storage.local.get([STORE_KEY]);
              render(data[STORE_KEY]);
            }

            async function clearCategory(kind){
              if (!TAB_IDS[kind]) return;
              const data = await chrome.storage.local.get([STORE_KEY]);
              const current = normalize(data[STORE_KEY]);
              if (!current[kind]) return;
              current[kind] = 0;
              const next = {
                quake: valueOf(current.quake),
                warning: valueOf(current.warning),
                cyclone: valueOf(current.cyclone),
                lastAt: (current.quake || current.warning || current.cyclone) ? current.lastAt : 0,
              };
              await chrome.storage.local.set({ [STORE_KEY]: next });
            }

            function init(){
              injectStyles();
              for (const [kind, tabId] of Object.entries(TAB_IDS)){
                document.getElementById(tabId)?.addEventListener("click", () => clearCategory(kind).catch(() => {}));
              }
              chrome.storage.onChanged.addListener((changes, area) => {
                if (area === "local" && changes[STORE_KEY]) render(changes[STORE_KEY].newValue);
              });
              load().catch(() => {});
            }

            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once:true });
            else init();
          })();
          ''', encoding="utf-8")

          # -------------------------
          # 共通の分類ロジック（テンメモ）
          # -------------------------
          tem_tail = r'''// ---- BCPサブタブ別の未読重要度判定 v1.3.138 ----
          function bcpTabSeverityLevel(value){
            if (value === true) return 2;
            if (value === "alert" || value === "red" || Number(value) >= 2) return 2;
            if (value === "update" || value === "yellow" || Number(value) === 1) return 1;
            return 0;
          }
          function bcpTabSeverityValue(level){
            return Number(level) >= 2 ? "alert" : Number(level) === 1 ? "update" : false;
          }
          function bcpTabQuakeId(item){
            return String(item?.id || item?.eventId || `${item?.eventTime || ""}|${item?.epicenter || ""}`);
          }
          function bcpTabQuakeSignature(item){
            return JSON.stringify([item?.eventTime||"",item?.epicenter||"",item?.magnitude||"",item?.maxIntensity||"",item?.reportTime||""]);
          }
          function bcpTabQuakeSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap = new Map((Array.isArray(oldData?.items)?oldData.items:[]).map((item)=>[bcpTabQuakeId(item),item]));
            let severity = 0;
            for (const item of (Array.isArray(newData?.items)?newData.items:[])){
              const score = Number(item?.intensityScore||0);
              if (score < 3) continue;
              const oldItem = oldMap.get(bcpTabQuakeId(item));
              if (!oldItem) return 2;
              const oldScore = Number(oldItem?.intensityScore||0);
              if (score > oldScore) return 2;
              if (bcpTabQuakeSignature(item) !== bcpTabQuakeSignature(oldItem)) severity = Math.max(severity,1);
            }
            return severity;
          }
          function bcpTabWarningKey(item,warning){
            return `${String(item?.areaCode||item?.id||item?.areaName||"")}:${String(warning?.phenomenon||warning?.code||warning?.name||"")}`;
          }
          function bcpTabWarningMap(data){
            const map = new Map();
            for (const item of (Array.isArray(data?.items)?data.items:[])){
              for (const warning of (Array.isArray(item?.warnings)?item.warnings:[])){
                map.set(bcpTabWarningKey(item,warning),{
                  level:Number(warning?.level||0),code:String(warning?.code||""),name:String(warning?.name||""),
                  status:String(warning?.status||""),reportDatetime:String(item?.reportDatetime||"")
                });
              }
            }
            return map;
          }
          function bcpTabWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpTabWarningMap(oldData), newMap=bcpTabWarningMap(newData);
            let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous) return 2;
              if (current.level > previous.level) return 2;
              if (current.level!==previous.level || current.code!==previous.code || current.name!==previous.name || current.status!==previous.status || current.reportDatetime!==previous.reportDatetime){
                severity=Math.max(severity,1);
              }
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }
          function bcpTabCycloneId(item){
            return String(item?.id||item?.number||item?.slotId||item?.displayName||"");
          }
          function bcpTabCycloneSignature(item){
            return JSON.stringify([
              item?.reportDateTime||"",item?.targetDateTime||"",Number(item?.intensityLevel||0),!!item?.ended,
              item?.pressure||"",item?.direction||"",item?.speedKmH||"",item?.maxWindMS||"",item?.gustWindMS||"",
              Array.isArray(item?.forecasts)?item.forecasts:[]
            ]);
          }
          function bcpTabCycloneSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=new Map((Array.isArray(oldData?.items)?oldData.items:[]).map((item)=>[bcpTabCycloneId(item),item]));
            let severity=0;
            for (const item of (Array.isArray(newData?.items)?newData.items:[])){
              const oldItem=oldMap.get(bcpTabCycloneId(item));
              if (!oldItem) return 2;
              if (Number(item?.intensityLevel||0)>Number(oldItem?.intensityLevel||0)) return 2;
              if (bcpTabCycloneSignature(item)!==bcpTabCycloneSignature(oldItem)) severity=Math.max(severity,1);
            }
            return severity;
          }
          async function bcpMarkTabUnread(kind,severity){
            if (!["quake","warning","cyclone"].includes(kind)) return;
            const incoming=bcpTabSeverityLevel(severity);
            if (!incoming) return;
            const data=await chrome.storage.local.get([BCP_TAB_UNREAD_KEY]);
            const raw=data[BCP_TAB_UNREAD_KEY]||{};
            const merged=Math.max(bcpTabSeverityLevel(raw[kind]),incoming);
            await chrome.storage.local.set({
              [BCP_TAB_UNREAD_KEY]:{
                quake:bcpTabSeverityValue(kind==="quake"?merged:bcpTabSeverityLevel(raw.quake)),
                warning:bcpTabSeverityValue(kind==="warning"?merged:bcpTabSeverityLevel(raw.warning)),
                cyclone:bcpTabSeverityValue(kind==="cyclone"?merged:bcpTabSeverityLevel(raw.cyclone)),
                lastAt:Date.now()
              }
            });
          }
          chrome.storage.onChanged.addListener((changes,area)=>{
            if (area!=="local") return;
            const detected=[];
            if (changes[BCP_TAB_DATA_KEYS.quake]){
              const s=bcpTabQuakeSeverity(changes[BCP_TAB_DATA_KEYS.quake].oldValue,changes[BCP_TAB_DATA_KEYS.quake].newValue);
              if (s) detected.push(["quake",s]);
            }
            if (changes[BCP_TAB_DATA_KEYS.warning]){
              const s=bcpTabWarningSeverity(changes[BCP_TAB_DATA_KEYS.warning].oldValue,changes[BCP_TAB_DATA_KEYS.warning].newValue);
              if (s) detected.push(["warning",s]);
            }
            if (changes[BCP_TAB_DATA_KEYS.cyclone]){
              const s=bcpTabCycloneSeverity(changes[BCP_TAB_DATA_KEYS.cyclone].oldValue,changes[BCP_TAB_DATA_KEYS.cyclone].newValue);
              if (s) detected.push(["cyclone",s]);
            }
            if (!detected.length) return;
            bcpTabUnreadQueue=bcpTabUnreadQueue.then(async()=>{
              for (const [kind,severity] of detected) await bcpMarkTabUnread(kind,severity);
            }).catch(()=>{});
          });
          '''
          replace_tail(Path("temmemo/service_worker_entry.js"), "// ---- BCPサブタブ別の新着判定 v1.3.135 ----", tem_tail)

          # -------------------------
          # 分離版: 既存の強アラート処理は維持し、Tab重要度は保存データ差分から統一判定
          # -------------------------
          standalone_attention = r'''function bcpAttentionLevel(value){
            if (value === true) return 2;
            if (value === "alert" || value === "red" || Number(value) >= 2) return 2;
            if (value === "update" || value === "yellow" || Number(value) === 1) return 1;
            return 0;
          }
          function bcpAttentionValue(level){
            return Number(level) >= 2 ? "alert" : Number(level) === 1 ? "update" : false;
          }
          function bcpNormalizeAttentionV109(attention){
            const raw=attention&&typeof attention==="object"?attention:{};
            const q=bcpAttentionLevel(raw.quake),w=bcpAttentionLevel(raw.warning),c=bcpAttentionLevel(raw.cyclone);
            const count=[q,w,c].filter((v)=>v>0).length;
            return {count,lastAt:count?Number(raw.lastAt||0):0,quake:bcpAttentionValue(q),warning:bcpAttentionValue(w),cyclone:bcpAttentionValue(c)};
          }

          // 旧refresh内の addAttention(kind) はここでは表示状態を直接変えない。
          // 保存データ差分を下のlistenerで分類し、明示severity付き呼び出しだけ反映する。
          addAttention=async function(kind,severity){
            if (!["quake","warning","cyclone"].includes(kind)) return;
            const incoming=bcpAttentionLevel(severity);
            if (!incoming) return;
            const data=await chrome.storage.local.get([STORE.attention]);
            const current=bcpNormalizeAttentionV109(data[STORE.attention]);
            const merged=Math.max(bcpAttentionLevel(current[kind]),incoming);
            const next=bcpNormalizeAttentionV109({...current,[kind]:bcpAttentionValue(merged),lastAt:Date.now()});
            next.lastAt=Date.now();
            await chrome.storage.local.set({[STORE.attention]:next});
            await syncActionBadge(next);
          };

          clearAttention=async function(kind){
            let category=["quake","warning","cyclone"].includes(kind)?kind:"";
            if (!category){
              const data=await chrome.storage.local.get([STORE.view]);
              category=data[STORE.view]==="warning"?"warning":data[STORE.view]==="cyclone"?"cyclone":"quake";
            }
            const data=await chrome.storage.local.get([STORE.attention]);
            const current=bcpNormalizeAttentionV109(data[STORE.attention]);
            const next=bcpNormalizeAttentionV109({...current,[category]:false});
            if (next.count>0) next.lastAt=current.lastAt||Date.now();
            await chrome.storage.local.set({[STORE.attention]:next});
            await syncActionBadge(next);
          };

          function bcpStandaloneQuakeId(item){return String(item?.id||item?.eventId||`${item?.eventTime||""}|${item?.epicenter||""}`)}
          function bcpStandaloneQuakeSig(item){return JSON.stringify([item?.eventTime||"",item?.epicenter||"",item?.magnitude||"",item?.maxIntensity||"",item?.reportTime||""])}
          function bcpStandaloneQuakeSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=new Map((Array.isArray(oldData?.items)?oldData.items:[]).map((item)=>[bcpStandaloneQuakeId(item),item]));
            let severity=0;
            for (const item of (Array.isArray(newData?.items)?newData.items:[])){
              const score=Number(item?.intensityScore||0); if (score<3) continue;
              const oldItem=oldMap.get(bcpStandaloneQuakeId(item));
              if (!oldItem) return 2;
              if (score>Number(oldItem?.intensityScore||0)) return 2;
              if (bcpStandaloneQuakeSig(item)!==bcpStandaloneQuakeSig(oldItem)) severity=Math.max(severity,1);
            }
            return severity;
          }
          function bcpStandaloneWarningKey(item,warning){return `${String(item?.areaCode||item?.id||item?.areaName||"")}:${String(warning?.phenomenon||warning?.code||warning?.name||"")}`}
          function bcpStandaloneWarningMap(data){
            const map=new Map();
            for (const item of (Array.isArray(data?.items)?data.items:[])){
              for (const warning of (Array.isArray(item?.warnings)?item.warnings:[])){
                map.set(bcpStandaloneWarningKey(item,warning),{
                  level:Number(warning?.level||0),code:String(warning?.code||""),name:String(warning?.name||""),
                  status:String(warning?.status||""),reportDatetime:String(item?.reportDatetime||"")
                });
              }
            }
            return map;
          }
          function bcpStandaloneWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpStandaloneWarningMap(oldData),newMap=bcpStandaloneWarningMap(newData); let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous) return 2;
              if (current.level>previous.level) return 2;
              if (current.level!==previous.level||current.code!==previous.code||current.name!==previous.name||current.status!==previous.status||current.reportDatetime!==previous.reportDatetime) severity=Math.max(severity,1);
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }
          function bcpStandaloneCycloneId(item){return String(item?.id||item?.number||item?.slotId||item?.displayName||"")}
          function bcpStandaloneCycloneSig(item){return JSON.stringify([
            item?.reportDateTime||"",item?.targetDateTime||"",Number(item?.intensityLevel||0),!!item?.ended,item?.pressure||"",
            item?.direction||"",item?.speedKmH||"",item?.maxWindMS||"",item?.gustWindMS||"",Array.isArray(item?.forecasts)?item.forecasts:[]
          ])}
          function bcpStandaloneCycloneSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=new Map((Array.isArray(oldData?.items)?oldData.items:[]).map((item)=>[bcpStandaloneCycloneId(item),item])); let severity=0;
            for (const item of (Array.isArray(newData?.items)?newData.items:[])){
              const oldItem=oldMap.get(bcpStandaloneCycloneId(item));
              if (!oldItem) return 2;
              if (Number(item?.intensityLevel||0)>Number(oldItem?.intensityLevel||0)) return 2;
              if (bcpStandaloneCycloneSig(item)!==bcpStandaloneCycloneSig(oldItem)) severity=Math.max(severity,1);
            }
            return severity;
          }

          chrome.storage.onChanged.addListener((changes,area)=>{
            if (area!=="local") return;
            const detected=[];
            if (changes[STORE.quakes]){
              const s=bcpStandaloneQuakeSeverity(changes[STORE.quakes].oldValue,changes[STORE.quakes].newValue); if (s) detected.push(["quake",s]);
            }
            if (changes[STORE.warnings]){
              const s=bcpStandaloneWarningSeverity(changes[STORE.warnings].oldValue,changes[STORE.warnings].newValue); if (s) detected.push(["warning",s]);
            }
            if (changes[STORE.cyclones]){
              const s=bcpStandaloneCycloneSeverity(changes[STORE.cyclones].oldValue,changes[STORE.cyclones].newValue); if (s) detected.push(["cyclone",s]);
            }
            if (!detected.length) return;
            (async()=>{for (const [kind,severity] of detected) await addAttention(kind,severity)})().catch(()=>{});
          });
          '''
          replace_between(
              Path("standalone-bcp/background.js"),
              "function bcpNormalizeAttentionV104(attention){",
              "async function setupAlarms(){",
              standalone_attention,
          )

          # 分離版 panel.js の末尾IIFEを黄/赤対応へ置換
          panel_path=Path("standalone-bcp/panel.js")
          panel=panel_path.read_text(encoding="utf-8")
          marker='"use strict";\n(() => {\n  const ATTENTION_KEY = "bcp_attention_v1";'
          pos=panel.find(marker)
          if pos<0: raise SystemExit("standalone panel attention marker not found")
          panel_tail=r'''"use strict";
          (()=>{
            const ATTENTION_KEY="bcp_attention_v1";
            const CATEGORY_TABS={quake:"tabQuake",warning:"tabWarning",cyclone:"tabCyclone"};
            function levelOf(value){
              if (value===true) return 2;
              if (value==="alert"||value==="red"||Number(value)>=2) return 2;
              if (value==="update"||value==="yellow"||Number(value)===1) return 1;
              return 0;
            }
            function normalize(attention){
              const raw=attention&&typeof attention==="object"?attention:{};
              return {quake:levelOf(raw.quake),warning:levelOf(raw.warning),cyclone:levelOf(raw.cyclone)};
            }
            function render(attention){
              const levels=normalize(attention);
              for (const [kind,tabId] of Object.entries(CATEGORY_TABS)){
                const tab=document.getElementById(tabId); if (!tab) continue;
                tab.classList.toggle("hasNewUpdate",levels[kind]===1);
                tab.classList.toggle("hasNewAlert",levels[kind]>=2);
                tab.classList.remove("hasNew");
              }
            }
            async function load(){const data=await chrome.storage.local.get([ATTENTION_KEY]);render(data[ATTENTION_KEY])}
            async function clearCategory(kind){
              if (!CATEGORY_TABS[kind]) return;
              const data=await chrome.storage.local.get([ATTENTION_KEY]);
              const raw=data[ATTENTION_KEY]&&typeof data[ATTENTION_KEY]==="object"?data[ATTENTION_KEY]:{};
              const levels=normalize(raw); levels[kind]=0;
              const count=Object.values(levels).filter((v)=>v>0).length;
              await chrome.storage.local.set({[ATTENTION_KEY]:{
                ...raw,
                quake:levels.quake>=2?"alert":levels.quake===1?"update":false,
                warning:levels.warning>=2?"alert":levels.warning===1?"update":false,
                cyclone:levels.cyclone>=2?"alert":levels.cyclone===1?"update":false,
                count,lastAt:count?Number(raw.lastAt||Date.now()):0
              }});
            }
            document.addEventListener("DOMContentLoaded",()=>{
              load().catch(()=>{});
              for (const [kind,tabId] of Object.entries(CATEGORY_TABS)) document.getElementById(tabId)?.addEventListener("click",()=>clearCategory(kind).catch(()=>{}));
            });
            chrome.storage.onChanged.addListener((changes,area)=>{if (area==="local"&&changes[ATTENTION_KEY]) render(changes[ATTENTION_KEY].newValue)});
          })();
          '''
          panel_path.write_text(panel[:pos]+panel_tail,encoding="utf-8")

          # 分離版 CSS: 旧hasNewは残して互換、実表示は新classで上書き
          css_path=Path("standalone-bcp/panel.css")
          css=css_path.read_text(encoding="utf-8")
          css += r'''

          /* v1.0.9: unread severity glow */
          .tab.hasNewUpdate{
            border-color:#facc15;
            box-shadow:0 0 0 1px rgba(250,204,21,.75) inset,0 0 8px rgba(250,204,21,.75),0 0 16px rgba(245,158,11,.38);
            animation:bcpTabGlow 1.35s ease-in-out infinite;
          }
          .tab.on.hasNewUpdate{background:#26364d;border-color:#facc15}
          .tab.hasNewAlert{
            border-color:#ef4444;
            box-shadow:0 0 0 1px rgba(239,68,68,.82) inset,0 0 9px rgba(239,68,68,.82),0 0 19px rgba(220,38,38,.48);
            animation:bcpTabGlowRed 1.05s ease-in-out infinite;
          }
          .tab.on.hasNewAlert{background:#26364d;border-color:#ef4444}
          @keyframes bcpTabGlowRed{
            0%,100%{box-shadow:0 0 0 1px rgba(239,68,68,.62) inset,0 0 6px rgba(239,68,68,.52),0 0 12px rgba(220,38,38,.24)}
            50%{box-shadow:0 0 0 1px rgba(248,113,113,.98) inset,0 0 13px rgba(248,113,113,.98),0 0 25px rgba(220,38,38,.66)}
          }
          @media (prefers-reduced-motion:reduce){
            .tab.hasNewUpdate{animation:none;box-shadow:0 0 0 1px rgba(250,204,21,.85) inset,0 0 10px rgba(250,204,21,.8)}
            .tab.hasNewAlert{animation:none;box-shadow:0 0 0 1px rgba(239,68,68,.9) inset,0 0 11px rgba(239,68,68,.9)}
          }
          '''
          css_path.write_text(css,encoding="utf-8")

          # versions
          p=Path("temmemo/manifest.json"); m=json.loads(p.read_text(encoding="utf-8")); m["version"]="1.3.138"
          m["description"]="BCPサブタブ未読表示を2段階化。新規事象・警戒レベル/勢力上昇は赤、同レベルの情報更新は黄色で発光し、黄色未読中に赤対象が来た場合は赤へ昇格。 / "+m.get("description","")
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          p=Path("standalone-bcp/manifest.json"); m=json.loads(p.read_text(encoding="utf-8")); m["version"]="1.0.9"
          m["description"]="BCP分離版。v1.0.9でTab未読表示を2段階化。新規事象・警戒レベル/勢力上昇は赤、同レベルの情報更新は黄色で発光し、黄色未読中に赤対象が来た場合は赤へ昇格。"
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          node --check temmemo/service_worker_entry.js
          node --check temmemo/bcp_tab_glow.js
          node --check standalone-bcp/background.js
          node --check standalone-bcp/panel.js
          python -m json.tool temmemo/manifest.json >/dev/null
          python -m json.tool standalone-bcp/manifest.json >/dev/null
          grep -Fq 'bcpHasAlert' temmemo/bcp_tab_glow.js
          grep -Fq 'Math.max(bcpTabSeverityLevel(raw[kind]),incoming)' temmemo/service_worker_entry.js
          grep -Fq 'hasNewAlert' standalone-bcp/panel.js
          grep -Fq 'Math.max(bcpAttentionLevel(current[kind]),incoming)' standalone-bcp/background.js

      - name: Build ZIPs
        shell: bash
        run: |
          set -euo pipefail
          (cd temmemo && zip -qr ../temmemo_v1.3.138.zip .)
          (cd standalone-bcp && zip -qr ../temmemo_bcp_standalone_v1.0.9.zip .)
          unzip -t temmemo_v1.3.138.zip >/dev/null
          unzip -t temmemo_bcp_standalone_v1.0.9.zip >/dev/null

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: bcp-tab-severity-zips
          path: |
            temmemo_v1.3.138.zip
            temmemo_bcp_standalone_v1.0.9.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bcp-tab-severity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Color-code BCP tab unread severity"
          git push
