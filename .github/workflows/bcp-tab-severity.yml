            50%{box-shadow:0 0 0 1px rgba(248,113,113,.98) inset,0 0 13px rgba(248,113,113,.98),0 0 25px rgba(220,38,38,.66)}
          }
          @media (prefers-reduced-motion: reduce){
            .tab.hasNewUpdate{animation:none;box-shadow:0 0 0 1px rgba(250,204,21,.85) inset,0 0 10px rgba(250,204,21,.8)}
            .tab.hasNewAlert{animation:none;box-shadow:0 0 0 1px rgba(239,68,68,.9) inset,0 0 11px rgba(239,68,68,.9)}
