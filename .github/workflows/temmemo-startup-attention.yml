name: Temmemo startup BCP attention

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temmemo-startup-attention.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup attention behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("temmemo/service_worker_entry.js")
          text = path.read_text(encoding="utf-8")

          old = '''const bcpNotifyOriginal = bcpNotify;
          bcpNotify = async function(title, message, url){
            if (bcpStartupSuppressDepth > 0){
              await bcpStartupAttentionOnly();
              return;
            }
            return bcpNotifyOriginal(title, message, url);
          };
          '''
          new = '''const bcpNotifyOriginal = bcpNotify;
          bcpNotify = async function(title, message, url){
            if (bcpStartupSuppressDepth > 0){
              // 起動直後の初回巡回ではOS通知を出さない。
              // 🚨は下段の「起動時の新規重要事象」判定だけで点滅させる。
              return;
            }
            return bcpNotifyOriginal(title, message, url);
          };
          '''
          if old not in text:
              raise SystemExit("startup notify wrapper marker not found")
          text = text.replace(old, new, 1)

          marker = '''function bcpWrapStartupRefresh(name){
          '''
          insert = '''const BCP_STARTUP_KIND_BY_REFRESH = {
            bcpWeatherRefreshQuakes: "quake",
            bcpWeatherRefreshWarnings: "warning",
            bcpWeatherRefreshCyclones: "cyclone",
          };

          async function bcpStartupReadCategory(kind){
            const key = BCP_TAB_DATA_KEYS[kind];
            if (!key) return null;
            try{
              const data = await chrome.storage.local.get([key]);
              return data[key] || null;
            }catch(_){
              return null;
            }
          }

          function bcpStartupHasNewImportant(kind, before, after){
            // 初回インストールなど、比較元が無い場合は「新規」と断定しない。
            if (!before?.updatedAt) return false;

            if (kind === "quake"){
              const oldIds = new Set(
                (Array.isArray(before?.items) ? before.items : []).map((item) => bcpTabQuakeId(item))
              );
              return (Array.isArray(after?.items) ? after.items : []).some((item) =>
                Number(item?.intensityScore || 0) >= 3 && !oldIds.has(bcpTabQuakeId(item))
              );
            }

            if (kind === "warning"){
              const oldMap = bcpTabWarningMap(before);
              const newMap = bcpTabWarningMap(after);
              for (const [key, current] of newMap){
                if (Number(current?.level || 0) < 3) continue;
                const previous = oldMap.get(key);
                // 新しい警報現象、または注意報から警報以上へ移行したもの。
                if (!previous || Number(previous?.level || 0) < 3) return true;
              }
              return false;
            }

            if (kind === "cyclone"){
              const oldIds = new Set(
                (Array.isArray(before?.items) ? before.items : []).map((item) => bcpTabCycloneId(item))
              );
              return (Array.isArray(after?.items) ? after.items : []).some((item) =>
                !item?.ended && !oldIds.has(bcpTabCycloneId(item))
              );
            }

            return false;
          }

          function bcpWrapStartupRefresh(name){
          '''
          if marker not in text:
              raise SystemExit("startup wrapper marker not found")
          text = text.replace(marker, insert, 1)

          old = '''  globalThis[name] = async function(...args){
            const suppress = bcpStartupPending.delete(name);

            // 自動更新OFF時は、起動・更新直後の自動取得そのものを行わない。
            // 手動の「今すぐ更新」は startupPending を消費した後なので従来どおり実行できる。
            if (suppress && !(await bcpAutoUpdateEnabled())){
              return { ok: true, skipped: true, reason: "auto-update-off" };
            }

            if (suppress) bcpStartupSuppressDepth += 1;
            try{
              return await original.apply(this, args);
            }finally{
              if (suppress) bcpStartupSuppressDepth = Math.max(0, bcpStartupSuppressDepth - 1);
            }
          };
          '''
          new = '''  globalThis[name] = async function(...args){
            const suppress = bcpStartupPending.delete(name);

            // 自動更新OFF時は、起動・更新直後の自動取得そのものを行わない。
            // 手動の「今すぐ更新」は startupPending を消費した後なので従来どおり実行できる。
            if (suppress && !(await bcpAutoUpdateEnabled())){
              return { ok: true, skipped: true, reason: "auto-update-off" };
            }

            const startupKind = suppress ? (BCP_STARTUP_KIND_BY_REFRESH[name] || "") : "";
            const before = startupKind ? await bcpStartupReadCategory(startupKind) : null;

            if (suppress) bcpStartupSuppressDepth += 1;
            try{
              const result = await original.apply(this, args);
              if (suppress && startupKind && result?.skipped !== true){
                const after = await bcpStartupReadCategory(startupKind);
                if (bcpStartupHasNewImportant(startupKind, before, after)){
                  await bcpStartupAttentionOnly();
                }
              }
              return result;
            }finally{
              if (suppress) bcpStartupSuppressDepth = Math.max(0, bcpStartupSuppressDepth - 1);
            }
          };
          '''
          if old not in text:
              raise SystemExit("startup wrapped refresh body marker not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '// ブラウザ起動時に取り込んだ「ブラウザ停止中の新着」はOS通知せず、🚨のみ点滅させる。',
              '// ブラウザ起動時の初回巡回はOS通知を抑止し、新規の重要事象だけ🚨を点滅させる。',
              1,
          )
          text = text.replace(
              '// 拡張機能の更新・再読み込み直後も同じ初回取り込み扱いにして通知ラッシュを防ぐ。',
              '// 拡張機能の更新・再読み込み直後も同じ初回取り込み扱いにして通知ラッシュを防ぐ。',
              1,
          )
          path.write_text(text, encoding="utf-8")

          manifest_path = Path("temmemo/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "1.3.139"
          manifest["description"] = (
              "起動直後の初回巡回はOS通知を抑止したまま、前回取得後に新規発生した震度3以上の地震、"
              "新規の警報以上（注意報から警報以上への移行を含む）、新規台風を検知した場合だけ🚨を点滅。 / "
              + manifest.get("description", "")
          )
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          node --check temmemo/service_worker_entry.js
          python -m json.tool temmemo/manifest.json >/dev/null
          grep -q 'bcpStartupHasNewImportant' temmemo/service_worker_entry.js
          grep -q '"version": "1.3.139"' temmemo/manifest.json

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd temmemo
          zip -qr ../temmemo_v1.3.139.zip .
          cd ..
          unzip -t temmemo_v1.3.139.zip >/dev/null

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: temmemo-v1.3.139
          path: temmemo_v1.3.139.zip
          if-no-files-found: error

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temmemo-startup-attention.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temmemo/service_worker_entry.js temmemo/manifest.json .github/workflows/temmemo-startup-attention.yml
          git commit -m "Update temmemo startup BCP attention behavior"
          git push
