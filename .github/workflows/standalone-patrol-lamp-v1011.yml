name: Standalone patrol lamp v1.0.11

on:
  push:
    paths:
      - '.github/workflows/standalone-patrol-lamp-v1011.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch standalone patrol lamp behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # --- background.js ---
          bg = Path('standalone-bcp/background.js')
          text = bg.read_text(encoding='utf-8')

          old = '''async function syncActionBadge(attention){
            const active = Number(attention?.count || 0) > 0;
            try{
              await chrome.action.setBadgeBackgroundColor({ color: "#dc2626" });
              await chrome.action.setBadgeText({ text: active ? "!" : "" });
              await chrome.action.setTitle({
                title: active ? "BCPアラート（新着あり）" : "BCPアラート"
              });
            }catch(_){ }
          }'''
          new = '''async function syncActionBadge(_attention){
            // v1.0.11: Edgeツールバーの「!」バッジは廃止。
            // 未確認の重要事象はサイドパネル内の🚨で知らせる。
            try{
              await chrome.action.setBadgeText({ text: "" });
              await chrome.action.setTitle({ title: "BCPアラート" });
            }catch(_){ }
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''function bcpStandaloneWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpStandaloneWarningMap(oldData),newMap=bcpStandaloneWarningMap(newData); let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous) return 2;
              if (current.level>previous.level) return 2;
              if (current.level!==previous.level||current.code!==previous.code||current.name!==previous.name||current.status!==previous.status||current.reportDatetime!==previous.reportDatetime) severity=Math.max(severity,1);
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }'''
          new = '''function bcpStandaloneWarningSeverity(oldData,newData){
            if (!oldData?.updatedAt) return 0;
            const oldMap=bcpStandaloneWarningMap(oldData),newMap=bcpStandaloneWarningMap(newData); let severity=0;
            for (const [key,current] of newMap){
              const previous=oldMap.get(key);
              if (!previous){
                // テンメモ準拠: 新規の警報以上は赤、新規注意報は黄色。
                if (Number(current.level||0)>=3) return 2;
                severity=Math.max(severity,1);
                continue;
              }
              if (current.level>previous.level) return 2;
              if (current.level!==previous.level||current.code!==previous.code||current.name!==previous.name||current.status!==previous.status||current.reportDatetime!==previous.reportDatetime) severity=Math.max(severity,1);
            }
            for (const key of oldMap.keys()) if (!newMap.has(key)) severity=Math.max(severity,1);
            return severity;
          }'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('function bcpNormalizeAttentionV109(attention){', 'function bcpNormalizeAttentionV111(attention){')
          text = text.replace('bcpNormalizeAttentionV109(', 'bcpNormalizeAttentionV111(')
          bg.write_text(text, encoding='utf-8')

          # --- panel.html ---
          html = Path('standalone-bcp/panel.html')
          text = html.read_text(encoding='utf-8')
          old = '''    <div class="titleWrap">
              <span id="bcpAttention" class="attention" hidden aria-label="未確認のBCP情報あり"></span>
              <h1>🚨 BCPアラート</h1>
            </div>'''
          new = '''    <div class="titleWrap">
              <span id="bcpPatrolLamp" class="patrolLamp" role="img" aria-label="未確認の重要BCP情報">🚨</span>
              <h1>BCPアラート</h1>
            </div>'''
          assert old in text
          text = text.replace(old, new, 1)
          html.write_text(text, encoding='utf-8')

          # --- panel.css ---
          css = Path('standalone-bcp/panel.css')
          text = css.read_text(encoding='utf-8')
          old = '.attention{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.18)}'
          new = '''.patrolLamp{
            display:inline-flex;align-items:center;justify-content:center;
            width:30px;height:30px;border-radius:8px;border:1px solid transparent;
            font-size:21px;line-height:1;flex:0 0 auto;
          }
          .patrolLamp.isAlert{
            border-color:rgba(239,68,68,.98);
            background:rgba(127,29,29,.35);
            animation:bcpPatrolLampBlink .48s steps(2,end) infinite,bcpPatrolLampPulse .48s ease-out infinite;
          }
          @keyframes bcpPatrolLampBlink{
            0%,49%{opacity:1;filter:brightness(1.35) drop-shadow(0 0 7px rgba(248,113,113,.95))}
            50%,100%{opacity:.42;filter:brightness(.78)}
          }
          @keyframes bcpPatrolLampPulse{
            0%{box-shadow:0 0 0 2px rgba(239,68,68,.72),0 0 0 0 rgba(239,68,68,.55)}
            100%{box-shadow:0 0 0 2px rgba(239,68,68,.38),0 0 0 9px rgba(239,68,68,0)}
          }'''
          assert old in text
          text = text.replace(old, new, 1)
          text += '''\n/* v1.0.11: patrol lamp follows red unread tabs */\n@media (prefers-reduced-motion:reduce){\n  .patrolLamp.isAlert{animation:none;background:rgba(127,29,29,.45);box-shadow:0 0 0 2px rgba(239,68,68,.55);filter:brightness(1.2)}\n}\n'''
          css.write_text(text, encoding='utf-8')

          # --- panel.js ---
          panel = Path('standalone-bcp/panel.js')
          text = panel.read_text(encoding='utf-8')

          marker = 'let lastWarningError = null;\n'
          insert = '''let lastWarningError = null;

          function patrolLevel(value){
            if (value===true) return 2;
            if (value==="alert"||value==="red"||Number(value)>=2) return 2;
            if (value==="update"||value==="yellow"||Number(value)===1) return 1;
            return 0;
          }

          function renderPatrolLamp(attention){
            const raw=attention&&typeof attention==="object"?attention:{};
            const hasRed=[raw.quake,raw.warning,raw.cyclone].some((value)=>patrolLevel(value)>=2);
            const lamp=$("bcpPatrolLamp");
            if (!lamp) return;
            lamp.classList.toggle("isAlert",hasRed);
            lamp.setAttribute("aria-label",hasRed?"未確認の重要BCP情報あり":"未確認の重要BCP情報なし");
            lamp.title=hasRed?"重要な未確認情報があります":"重要な未確認情報はありません";
          }
'''
          assert marker in text and 'function renderPatrolLamp' not in text
          text = text.replace(marker, insert, 1)

          old = '''  const attention = data[STORE.attention] || { count: 0 };
            $("bcpAttention").hidden = Number(attention.count || 0) <= 0;'''
          new = '''  const attention = data[STORE.attention] || { count: 0 };
            renderPatrolLamp(attention);'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  // v1.0.10: 起動時に全カテゴリを一括既読にしない。
            // 未読は各Tabを実際に確認した時だけカテゴリ単位で解除する。
            if ($("bcpAttention")) $("bcpAttention").hidden = true;'''
          new = '''  // v1.0.11: 起動時も未読は各Tabを確認した時だけカテゴリ単位で解除する。
            // 赤Tabが1つでも未確認なら、パネル上部の🚨を点滅させる。'''
          assert old in text
          text = text.replace(old, new, 1)
          panel.write_text(text, encoding='utf-8')

          # --- manifest ---
          manifest = Path('standalone-bcp/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('version') == '1.0.10'
          data['version'] = '1.0.11'
          prefix = 'Edgeツールバーの「!」バッジを廃止し、パネル上部へ🚨を設置。赤Tabが1つでも未確認なら🚨を点滅し、黄色Tabだけなら点滅しない。該当Tab確認でカテゴリ単位に解除。気象Tabは新規の警報以上・レベル上昇を赤、新規注意報・同レベル更新・解除/低下を黄色にテンメモと統一。 / '
          data['description'] = prefix + data.get('description','')
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check standalone-bcp/background.js
          node --check standalone-bcp/panel.js
          python -m json.tool standalone-bcp/manifest.json >/dev/null
          grep -q '"version": "1.0.11"' standalone-bcp/manifest.json
          grep -q 'id="bcpPatrolLamp"' standalone-bcp/panel.html
          grep -q 'renderPatrolLamp(attention)' standalone-bcp/panel.js
          grep -q 'Number(current.level||0)>=3' standalone-bcp/background.js
          ! grep -q 'active ? "!"' standalone-bcp/background.js

      - name: Build ZIP
        shell: bash
        run: |
          zip -qr temmemo_bcp_standalone_v1.0.11.zip standalone-bcp
          unzip -t temmemo_bcp_standalone_v1.0.11.zip >/dev/null

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: standalone-bcp-v1.0.11
          path: temmemo_bcp_standalone_v1.0.11.zip

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f temmemo_bcp_standalone_v1.0.11.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/standalone-patrol-lamp-v1011.yml
          git add standalone-bcp/background.js standalone-bcp/panel.js standalone-bcp/panel.css standalone-bcp/panel.html standalone-bcp/manifest.json
          git commit -m "Add standalone patrol lamp and sync alert rules"
          git push
