<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>テン･メモBCP</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="topbar">
    <div class="topLeft">
      <input id="userName" class="nameIn" type="text" placeholder="ユーザー名入力" readonly />
      <div class="topRight" aria-label="上部操作">
        <button id="btnNameEdit" class="iconBtn nameEdit" type="button"
          title="氏名の編集：OFF" aria-label="氏名の編集を切替">✎</button>
        <button id="btnLayoutMode" class="iconBtn" type="button" title="ABCD表示へ切替" aria-label="ABCD表示へ切替">⇔</button>
        <button id="btnBcp" class="iconBtn" type="button" title="BCPアラート" aria-label="BCPアラート">🚨</button>
      </div>
    </div>
    <!-- 更新ボタンは廃止：テンプレは自動同期（未設定時のみ一覧内カードから設定） -->

  </header>

  <div class="modeBar">
    <div class="tabsRow tabsRowTop">
      <div class="tabs" role="tablist" aria-label="表示切替">
        <button id="tabTpl" class="tab on" type="button" data-tab="tpl">Temp</button>
        <button id="tabMemo" class="tab" type="button" data-tab="memo">Note</button>
      </div>
      <div id="memoIo" class="ioBtns" aria-label="データの入出力">
        <button id="btnImport" class="iconBtn ioPri ioSvgBtn" type="button" title="追加メモをインポート" aria-label="追加メモをインポート">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 20h14v-2H5v2z"/>
            <path d="M12 2L5.33 8.67l1.41 1.41L11 5.83V16h2V5.83l4.26 4.25 1.41-1.41L12 2z"/>
          </svg>
        </button>
        <button id="btnExport" class="iconBtn ioDanger ioSvgBtn" type="button" title="追加メモをエクスポート" aria-label="追加メモをエクスポート">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 20h14v-2H5v2z"/>
            <path d="M12 2L5.33 8.67l1.41 1.41L11 5.83V16h2V5.83l4.26 4.25 1.41-1.41L12 2z" transform="translate(0 18) scale(1 -1)"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" style="position:fixed;right:12px;top:56px;z-index:99999;font-size:12px;color:#9ca3af;pointer-events:none;"></div>



  <div id="bodyModal" class="bodyModal" hidden aria-hidden="true">
    <div id="bodyModalBackdrop" class="bodyModalBackdrop"></div>
    <section class="bodyModalPanel bodyModalPanelFull" role="dialog" aria-modal="true" aria-label="本文拡大編集">
      <div id="bodyModalEditor" class="ta ce bodyModalEditor bodyModalEditorFull" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="本文を入力（URL貼り付けでリンク化）"></div>
    </section>
  </div>

  <main class="wrap">
    <!-- Editor -->
    <section class="pane editor">
      <div class="row editorSubjectRow">
        <input id="subj" class="in" type="text" placeholder="件名（ダブルクリックでコピー）" />
      </div>

      <div class="row grow editorBodyRow">
        <div id="body" class="ta ce" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="本文（URL貼り付けでリンク化／ダブルクリックでコピー）"></div>
      </div>

      <div class="row editorTagsRow">
        <input id="tags" class="in" type="text" placeholder="タグ（スペース区切りで複数入力）" />
      </div>

      <div class="row foot">
        <div class="btnGrp">
          <button id="btnAdd" class="btn pri" type="button">追加</button>
          <button id="btnDelete" class="btn danger" type="button">削除</button>
          <button id="btnBodyExpand" class="btn ghost" type="button" title="本文を拡大表示" aria-label="本文を拡大表示">本文拡大</button>
          <button id="btnClear" class="btn ghost" type="button" title="クリア">クリア</button>
        </div>
      </div>
    </section>

    <!-- List -->
    <section class="pane list">
      <div class="listHdr">
        <div class="ttl">一覧/検索</div>

</div>


      <!-- BCP (tab pane) -->
      <div id="bcpPane" class="bcpPane" aria-label="BCPアラート">
        <div class="bcpInlineHead">
          <div class="bcpInlineTitle">🚨 BCPアラート</div>
        </div>

        <div class="bcpSubTabs" role="tablist" aria-label="BCP情報源">
          <button id="bcpSubJma" class="bcpSubTab on" type="button" role="tab"
            aria-selected="true" aria-controls="bcpViewJma">地震情報</button>
          <button id="bcpSubWarning" class="bcpSubTab" type="button" role="tab"
            aria-selected="false" aria-controls="bcpViewWarning">気象警報</button>
          <button id="bcpSubCyclone" class="bcpSubTab" type="button" role="tab"
            aria-selected="false" aria-controls="bcpViewCyclone">台風情報</button>
        </div>

        <div class="bcpControlBar">
          <div id="bcpControlJma" class="bcpSourceControl">
            <div class="row bcpRow bcpControlLine">
              <label class="chk bcpChk"><input type="checkbox" id="bcpQuakeEnable" /> 通知を有効</label>
              <div class="row mini bcpMini">
                <div class="bcpMiniLbl">巡回(分)</div>
                <input id="bcpQuakePeriod" class="in bcpNum" type="number" min="1" step="1" />
              </div>
            </div>
            <div class="row bcpRow bcpBtns bcpActionLine">
              <button id="bcpQuakeSave" class="btn pri" type="button">保存</button>
              <button id="bcpQuakeRefresh" class="btn" type="button">今すぐ更新</button>
              <span id="bcpQuakeLastUpdated" class="bcpLastUpdated" title="地震情報の最終更新時刻"></span>
            </div>
          </div>

          <div id="bcpControlWarning" class="bcpSourceControl" hidden>
            <div class="row bcpRow bcpControlLine">
              <label class="chk bcpChk"><input type="checkbox" id="bcpWarningEnable" /> 通知を有効</label>
              <label class="chk bcpChk"><input type="checkbox" id="bcpShowAdvisory" /> 注意報も表示</label>
              <div class="row mini bcpMini">
                <div class="bcpMiniLbl">巡回(分)</div>
                <input id="bcpWarningPeriod" class="in bcpNum" type="number" min="1" step="1" />
              </div>
            </div>
            <div class="row bcpRow bcpBtns bcpActionLine">
              <button id="bcpWarningSave" class="btn pri" type="button">保存</button>
              <button id="bcpWarningRefresh" class="btn" type="button">今すぐ更新</button>
              <span id="bcpWarningLastUpdated" class="bcpLastUpdated" title="気象警報の最終更新時刻"></span>
            </div>
          </div>

          <div id="bcpControlCyclone" class="bcpSourceControl" hidden>
            <div class="row bcpRow bcpControlLine">
              <label class="chk bcpChk"><input type="checkbox" id="bcpCycloneEnable" /> 通知を有効</label>
              <div class="row mini bcpMini">
                <div class="bcpMiniLbl">巡回(分)</div>
                <input id="bcpCyclonePeriod" class="in bcpNum" type="number" min="1" step="1" />
              </div>
            </div>
            <div class="row bcpRow bcpBtns bcpActionLine">
              <button id="bcpCycloneSave" class="btn pri" type="button">保存</button>
              <button id="bcpCycloneRefresh" class="btn" type="button">今すぐ更新</button>
              <span id="bcpCycloneLastUpdated" class="bcpLastUpdated" title="台風情報の最終更新時刻"></span>
            </div>
          </div>
        </div>

        <section id="bcpViewJma" class="bcpSourceView" role="tabpanel" aria-labelledby="bcpSubJma">
          <div id="bcpJmaList" class="bcpList" aria-label="気象庁の地震情報一覧"></div>
        </section>

        <section id="bcpViewWarning" class="bcpSourceView" role="tabpanel" aria-labelledby="bcpSubWarning" hidden>
          <div id="bcpWarningList" class="bcpList" aria-label="全国の気象警報一覧"></div>
        </section>

        <section id="bcpViewCyclone" class="bcpSourceView" role="tabpanel" aria-labelledby="bcpSubCyclone" hidden>
          <div id="bcpCycloneList" class="bcpList" aria-label="気象庁の台風情報一覧"></div>
        </section>
      </div>

      <div class="searchRow">
        <input id="q" class="search" type="text" placeholder="検索（件名・本文・タグ）" />

        <button id="btnClearQ" class="iconBtn" type="button" title="検索クリア">×</button>
      </div>

      <div id="favTags" class="favTags" aria-label="よく使うタグ"></div>
      <div id="list" class="listBody"></div>
    </section>
  </main>
  <script src="panel.js"></script>
  <script src="bcp_enhancements.js"></script>
  <script src="bcp_tab_glow.js"></script>
</body>
</html>
